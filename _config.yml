# ----
# Site

include: [".well-known"]

title: Alejandro Aristizábal
url: "https://aristizabal95.github.io"
baseurl:
google_analytics_key:
google_maps_javascript_api_key:
disqus_shortname:

# Values for the jekyll-seo-tag gem (https://github.com/jekyll/jekyll-seo-tag)
logo: /images/favicon.png
description: AI Safety Researcher and Machine Learning Engineer. Researcher at Arcadia Impact's Alignment Team.
author:
  name: Alejandro Aristizábal
  twitter: # twitter username without the @ symbol
social:
  name: Alejandro Aristizábal
  links:
    - https://github.com/aristizabal95
    - https://www.linkedin.com/in/aristizabal95
    - https://scholar.google.com/citations?user=6HdJEPYAAAAJ&hl=en

# -----
# Build

timezone: Etc/UTC

permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-archives

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE

collections:
  staff_members:
    _hide_content: true
    _icon: account_circle

paginate: 10
paginate_path: "/blog/:num/"

jekyll-archives:
  enabled: ['categories']

defaults:
  -
    scope:
      path: ""
      type: "staff_members"
    values:
      _options:
        image_path:
          width: 440
          height: 440
          uploads_dir: "/images/staff_members"
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      type: "posts"
    values:
      layout: "post"
      _options:
        image:
          width: 2000
          height: 1322
          resize_style: cover
          uploads_dir: "/images/post_uploads"
        content:
          width: 1500
          height: 2000
          uploads_dir: "/images/post_uploads"
  -
    scope:
      path: "contact-success.html"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "pages"
    values:
      image:
        width: 2000
        height: 1322
        resize_style: cover
      bottom_image:
        width: 2000
        height: 1322
        resize_style: cover

# -----------
# CloudCannon

social_icons:
  - Facebook
  - LinkedIn
  - Email
  - Github

_comments:
  description: AI Safety Researcher and Machine Learning Engineer
  blurb: Alejandro is an AI Safety Researcher and ML Engineer working on scalable oversight and debate protocols.
