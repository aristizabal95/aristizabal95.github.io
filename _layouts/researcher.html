<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/images/favicon.svg">
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/images/favicon.png">
    <link rel="shortcut icon" href="{{ site.baseurl }}/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --paper:    #faf9f6;
            --ink:      #1a1a1a;
            --ink-mid:  #4a4a4a;
            --ink-faint:#8a8a8a;
            --rule:     #d4d0c8;
            --link:     #2c5282;
            --link-h:   #1a365d;
            --accent:   #7c4d28;
            --serif:    'Libre Baskerville', Georgia, serif;
            --sans:     'Source Sans 3', 'Source Sans Pro', sans-serif;
            --blur-bg:  rgba(250, 249, 246, 0.5);
            --blur-panel: rgba(250, 249, 246, 0.92);
            --blur-border: rgba(0, 0, 0, 0.04);
            --blur-shadow: rgba(0, 0, 0, 0.03);
            --ca-ink-r: 26;
            --ca-ink-g: 26;
            --ca-ink-b: 26;
        }

        [data-theme="dark"] {
            --paper:    #151518;
            --ink:      #e4e4e7;
            --ink-mid:  #a1a1aa;
            --ink-faint:#63636e;
            --rule:     #2e2e35;
            --link:     #7db4f5;
            --link-h:   #a3cbf7;
            --accent:   #c9946a;
            --blur-bg:  rgba(21, 21, 24, 0.5);
            --blur-panel: rgba(21, 21, 24, 0.92);
            --blur-border: rgba(255, 255, 255, 0.04);
            --blur-shadow: rgba(0, 0, 0, 0.15);
            --ca-ink-r: 140;
            --ca-ink-g: 140;
            --ca-ink-b: 148;
        }

        [data-theme="dark"] img.about-photo {
            filter: grayscale(8%) brightness(0.9);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 400;
            font-size: 16px;
            line-height: 1.7;
        }

        a {
            color: var(--link);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s;
        }

        a:hover {
            border-bottom-color: var(--link);
        }

        /* ── LAYOUT ──────────────── */
        .page {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 1.5rem 6rem;
        }

        /* ── HEADER ──────────────── */
        .site-header {
            margin-bottom: 3rem;
        }

        .site-name {
            font-family: var(--serif);
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 0.35rem;
        }

        .site-role {
            font-size: 0.95rem;
            color: var(--ink-mid);
            letter-spacing: 0.01em;
        }

        .site-role .dot {
            color: var(--ink-faint);
            margin: 0 0.35rem;
        }

        .site-nav {
            margin-top: 0.9rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .site-nav a {
            font-size: 0.88rem;
            color: var(--ink-mid);
            border-bottom: none;
        }

        .site-nav a:hover {
            color: var(--ink);
        }

        .header-icons {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--ink-faint);
            padding: 0;
            line-height: 1;
            width: 1.1rem;
            height: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            transition: color 0.15s;
        }

        .header-icon-btn:hover {
            color: var(--ink);
        }

        .settings-wrap {
            position: relative;
        }

        /* ── ABOUT ───────────────── */
        .about {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 1.75rem;
            align-items: start;
            margin-bottom: 2.5rem;
        }

        .about-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            filter: grayscale(8%);
        }

        .about-bio p {
            font-size: 0.95rem;
            line-height: 1.75;
            color: var(--ink-mid);
            margin-bottom: 0.75rem;
        }

        .about-bio p:last-child { margin-bottom: 0; }

        .about-bio strong { color: var(--ink); font-weight: 600; }
        .about-bio em { color: var(--ink); }

        /* ── SECTIONS ────────────── */
        .divider {
            border: none;
            border-top: 1px solid var(--rule);
            margin: 2.5rem 0;
        }

        .section-heading {
            font-family: var(--serif);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 1.25rem;
        }

        /* ── WRITING LIST ────────── */
        .writing-list {
            list-style: none;
        }

        .writing-list li {
            display: grid;
            grid-template-columns: 5.5rem 1fr;
            gap: 0.5rem;
            margin-bottom: 0.7rem;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .writing-date {
            color: var(--ink-faint);
            font-size: 0.85rem;
        }



        /* ── PUBLICATIONS ────────── */
        .pub-list {
            list-style: none;
        }

        .pub-list li {
            display: grid;
            grid-template-columns: 3rem 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .pub-year {
            color: var(--ink-faint);
            font-size: 0.85rem;
        }

        .pub-entry {
        }

        .pub-title-text {
            color: var(--ink);
        }

        .pub-venue-text {
            color: var(--ink-faint);
            font-style: italic;
        }

        .pub-doi {
            font-size: 0.8rem;
        }

        /* ── FOOTER / CONNECT ────── */
        .connect {
            font-size: 0.92rem;
            color: var(--ink-mid);
        }

        .connect-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .connect-links a {
            color: var(--ink-faint);
            font-size: 0.88rem;
        }

        .connect-links a:hover {
            color: var(--link);
        }

        /* ── CELLULAR AUTOMATA BG ── */
        #ca-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .page {
            position: relative;
            z-index: 1;
        }

        .content-blur {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 760px;
            height: 100%;
            background: var(--blur-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 0;
            pointer-events: none;
            border-left: 1px solid var(--blur-border);
            border-right: 1px solid var(--blur-border);
            box-shadow: 0 0 40px var(--blur-shadow);
        }

        @media (max-width: 540px) {
            .content-blur { width: 100%; }
        }

        /* ── CA CONTROLS ─────────── */
        .ca-controls-panel {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--blur-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--rule);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            width: 240px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            font-family: var(--sans);
            font-size: 0.78rem;
            z-index: 20;
        }

        .ca-controls-panel.open {
            display: block;
        }

        .ca-controls-panel label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
            color: var(--ink-mid);
        }

        .ca-controls-panel input[type="range"] {
            width: 110px;
            accent-color: var(--ink-faint);
        }

        .ca-controls-panel .ca-val {
            width: 2.5rem;
            text-align: right;
            color: var(--ink-faint);
            font-size: 0.72rem;
            font-family: monospace;
        }

        .ca-controls-panel button {
            margin-top: 0.4rem;
            width: 100%;
            padding: 0.3rem;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 4px;
            color: var(--ink-mid);
            font-family: var(--sans);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .ca-controls-panel button:hover {
            border-color: var(--ink-faint);
            color: var(--ink);
        }

        /* ── RESPONSIVE ──────────── */
        @media (max-width: 540px) {
            .page { padding: 2.5rem 1.25rem 4rem; }
            .about { grid-template-columns: 1fr; justify-items: start; gap: 1.25rem; }
            .about-photo { width: 90px; height: 90px; }
            .writing-date { width: 4.5rem; }
            .site-nav { flex-wrap: wrap; gap: 1rem; }
            .content-blur {
                background: none;
                backdrop-filter: blur(3px);
                -webkit-backdrop-filter: blur(3px);
                border: none;
                box-shadow: none;
            }
            .ca-controls-panel { width: 210px; }
        }
    </style>
    <script>
        // Apply theme before render to prevent flash
        (function() {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

<div class="page">

    <header class="site-header">
        <h1 class="site-name">Alejandro Aristizábal</h1>
        <p class="site-role">AI Safety Researcher<span class="dot">&middot;</span>Machine Learning Engineer</p>
        <nav class="site-nav">
            <a href="#about">About</a>
            <a href="#writing">Writing</a>
            <a href="#publications">Publications</a>
            <a href="#connect">Socials</a>
            <span class="header-icons">
                <span class="settings-wrap">
                    <button class="header-icon-btn" id="settings-toggle" aria-label="Background settings">&#9881;</button>
                    <div class="ca-controls-panel" id="ca-panel">
                        <label>diffusion <input type="range" id="ca-du" min="0.05" max="0.6" step="0.01" value="0.25"> <span class="ca-val" id="ca-du-val">0.25</span></label>
                        <label>threshold <input type="range" id="ca-a0" min="-0.2" max="0.3" step="0.01" value="-0.05"> <span class="ca-val" id="ca-a0-val">-0.05</span></label>
                        <label>recovery <input type="range" id="ca-eps" min="0.02" max="0.25" step="0.01" value="0.08"> <span class="ca-val" id="ca-eps-val">0.08</span></label>
                        <label>coupling <input type="range" id="ca-b" min="0.1" max="1.2" step="0.05" value="0.60"> <span class="ca-val" id="ca-b-val">0.60</span></label>
                        <label>noise <input type="range" id="ca-noise" min="0" max="0.06" step="0.002" value="0.015"> <span class="ca-val" id="ca-noise-val">0.015</span></label>
                        <label>intensity <input type="range" id="ca-peak" min="0.05" max="0.6" step="0.01" value="0.20"> <span class="ca-val" id="ca-peak-val">0.20</span></label>
                        <label>fatigue <input type="range" id="ca-fatigue" min="0" max="0.4" step="0.01" value="0.04"> <span class="ca-val" id="ca-fatigue-val">0.04</span></label>
                        <label>fat. decay <input type="range" id="ca-fatigueDecay" min="0.001" max="0.02" step="0.001" value="0.006"> <span class="ca-val" id="ca-fatigueDecay-val">0.006</span></label>
                        <button id="ca-reset">reset defaults</button>
                    </div>
                </span>
                <button class="header-icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
            </span>
        </nav>
    </header>

    {{ content }}

    <footer class="connect" id="connect">
        <div class="connect-links">
            <a href="https://www.linkedin.com/in/aristizabal95/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/aristizabal95" target="_blank" rel="noopener">GitHub</a>
            <a href="https://scholar.google.com/citations?user=6HdJEPYAAAAJ&hl=en" target="_blank" rel="noopener">Google Scholar</a>
            <a href="https://www.lesswrong.com/users/alejandro-aristizabal" target="_blank" rel="noopener">LessWrong</a>
        </div>
    </footer>

</div>

<canvas id="ca-bg"></canvas>
<div class="content-blur"></div>

<script>
(function() {
    const canvas = document.getElementById('ca-bg');
    const ctx = canvas.getContext('2d');

    const isMobile = window.innerWidth <= 540;
    const CHAR_SIZE = isMobile ? 18 : 14;
    const FONT = CHAR_SIZE + 'px monospace';
    const BASE_ALPHA = 0.04;
    // peak alpha is controlled by P.peak
    const TICK_MS = 50;
    const STEPS_PER_FRAME = 3;

    // FitzHugh-Nagumo excitable medium
    // Mutable params (controlled by sliders)
    const DEFAULTS = { Du: 0.25, a0: -0.05, eps: 0.08, b: 0.6, noise: 0.015, peak: 0.20, fatigue: 0.04, fatigueDecay: 0.006 };
    let P = { ...DEFAULTS };

    const a1 = 2.0;     // reaction strength (fixed)
    const dt = 0.14;

    const GLYPHS = '0123456789ABCDEFabcdef+-=<>{}[]|/\\~:.;!?@#$%^&*';

    let cols, rows;
    let u, v, nextU, nextV, chars, fatigue;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const newCols = Math.ceil(canvas.width / CHAR_SIZE) + 1;
        const newRows = Math.ceil(canvas.height / CHAR_SIZE) + 1;

        const oldU = u, oldV = v, oldChars = chars, oldFatigue = fatigue;
        const oldCols = cols || 0, oldRows = rows || 0;

        cols = newCols;
        rows = newRows;
        const size = cols * rows;

        u = new Float32Array(size);
        v = new Float32Array(size);
        nextU = new Float32Array(size);
        nextV = new Float32Array(size);
        chars = new Uint8Array(size);
        fatigue = new Float32Array(size);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const i = r * cols + c;
                if (oldU && r < oldRows && c < oldCols) {
                    const oi = r * oldCols + c;
                    u[i] = oldU[oi];
                    v[i] = oldV[oi];
                    chars[i] = oldChars[oi];
                    fatigue[i] = oldFatigue[oi];
                } else {
                    u[i] = (Math.random() - 0.5) * 0.01;
                    v[i] = (Math.random() - 0.5) * 0.01;
                    chars[i] = Math.floor(Math.random() * GLYPHS.length);
                    fatigue[i] = 0;
                }
            }
        }

        // Seed initial excitations
        seedRandom(3);
    }

    function seedRandom(count) {
        for (let s = 0; s < count; s++) {
            const cr = Math.floor(Math.random() * rows);
            const cc = Math.floor(Math.random() * cols);
            const radius = 2 + Math.floor(Math.random() * 2);
            for (let dr = -radius; dr <= radius; dr++) {
                for (let dc = -radius; dc <= radius; dc++) {
                    const r = cr + dr, c = cc + dc;
                    if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
                    if (dr * dr + dc * dc > radius * radius) continue;
                    const i = r * cols + c;
                    u[i] = 1.0;
                }
            }
        }
    }

    function lap4(arr, r, c) {
        const i = r * cols + c;
        const val = arr[i];
        let sum = -val * 4;
        sum += r > 0        ? arr[(r-1)*cols + c] : val;
        sum += r < rows - 1 ? arr[(r+1)*cols + c] : val;
        sum += c > 0        ? arr[r*cols + (c-1)] : val;
        sum += c < cols - 1 ? arr[r*cols + (c+1)] : val;
        return sum;
    }

    function step() {
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const i = r * cols + c;
                const uVal = u[i];
                const vVal = v[i];

                // FHN reaction with fatigue raising effective threshold
                const effThreshold = P.a0 + fatigue[i];
                const reaction = a1 * uVal * (1 - uVal) * (uVal - effThreshold) - vVal;
                const lapU = lap4(u, r, c);

                const noiseMul = 1 - Math.min(1, Math.abs(uVal) * 2);
                const noise = (Math.random() - 0.5) * P.noise * noiseMul;
                nextU[i] = uVal + dt * (P.Du * lapU + reaction) + noise;
                nextV[i] = vVal + dt * P.eps * (P.b * uVal - vVal);

                // Accumulate fatigue when firing, slowly decay otherwise
                if (uVal > 0.5) {
                    fatigue[i] += P.fatigue * dt;
                }
                fatigue[i] *= (1 - P.fatigueDecay);

                // Clamp
                if (nextU[i] > 1.2) nextU[i] = 1.2;
                if (nextU[i] < -0.2) nextU[i] = -0.2;
                if (fatigue[i] > 0.8) fatigue[i] = 0.8;
            }
        }

        const tmpU = u; u = nextU; nextU = tmpU;
        const tmpV = v; v = nextV; nextV = tmpV;
    }

    function tick() {
        for (let s = 0; s < STEPS_PER_FRAME; s++) {
            step();
        }

        // Random excitations to keep things alive and unpredictable
        if (Math.random() < 0.01) {
            const cr = Math.floor(Math.random() * rows);
            const cc = Math.floor(Math.random() * cols);
            const radius = 1 + Math.floor(Math.random() * 2);
            for (let dr = -radius; dr <= radius; dr++) {
                for (let dc = -radius; dc <= radius; dc++) {
                    const r = cr + dr, c = cc + dc;
                    if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
                    if (dr * dr + dc * dc > radius * radius) continue;
                    const i = r * cols + c;
                    if (u[i] < 0.15 && v[i] < 0.1) {
                        u[i] = 1.0;
                    }
                }
            }
        }

        // Update characters — low energy cells randomly shuffle, high energy picks by value
        for (let i = 0; i < cols * rows; i++) {
            const uVal = Math.abs(u[i]);
            if (uVal > 0.1) {
                chars[i] = Math.floor(uVal * (GLYPHS.length - 1)) % GLYPHS.length;
            } else if (Math.random() < 0.08) {
                chars[i] = Math.floor(Math.random() * GLYPHS.length);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = FONT;
        ctx.textBaseline = 'top';

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const i = r * cols + c;
                const uVal = Math.max(0, u[i]);
                const a = BASE_ALPHA + uVal * (P.peak - BASE_ALPHA);
                if (a < 0.005) continue;
                ctx.fillStyle = 'rgba(' + caR + ',' + caG + ',' + caB + ',' + a.toFixed(3) + ')';
                ctx.fillText(GLYPHS[chars[i]], c * CHAR_SIZE, r * CHAR_SIZE);
            }
        }
    }

    function loop() {
        tick();
        draw();
        setTimeout(loop, TICK_MS);
    }

    function perturb(x, y, strength, radius) {
        const cc = Math.floor(x / CHAR_SIZE);
        const cr = Math.floor(y / CHAR_SIZE);
        for (let dr = -radius; dr <= radius; dr++) {
            for (let dc = -radius; dc <= radius; dc++) {
                const r = cr + dr;
                const c = cc + dc;
                if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
                const dist = Math.sqrt(dr * dr + dc * dc);
                if (dist > radius) continue;
                const falloff = 1 - dist / (radius + 1);
                const i = r * cols + c;
                u[i] = Math.max(u[i], strength * falloff);
                fatigue[i] *= (1 - falloff);
            }
        }
    }

    document.addEventListener('mousemove', function(e) {
        perturb(e.clientX, e.clientY, 0.6, 2);
    });

    document.addEventListener('click', function(e) {
        perturb(e.clientX, e.clientY, 1.0, 5);
    });

    document.addEventListener('touchmove', function(e) {
        var t = e.touches[0];
        perturb(t.clientX, t.clientY, 0.6, 2);
    }, { passive: true });

    document.addEventListener('touchstart', function(e) {
        var t = e.touches[0];
        perturb(t.clientX, t.clientY, 1.0, 5);
    }, { passive: true });

    // Wire up controls
    const sliders = [
        { id: 'ca-du',    key: 'Du',    parse: parseFloat },
        { id: 'ca-a0',    key: 'a0',    parse: parseFloat },
        { id: 'ca-eps',   key: 'eps',   parse: parseFloat },
        { id: 'ca-b',     key: 'b',     parse: parseFloat },
        { id: 'ca-noise', key: 'noise', parse: parseFloat },
        { id: 'ca-peak',  key: 'peak',  parse: parseFloat },
        { id: 'ca-fatigue', key: 'fatigue', parse: parseFloat },
        { id: 'ca-fatigueDecay', key: 'fatigueDecay', parse: parseFloat },
    ];

    sliders.forEach(function(s) {
        const input = document.getElementById(s.id);
        const val = document.getElementById(s.id + '-val');
        input.addEventListener('input', function() {
            P[s.key] = s.parse(input.value);
            val.textContent = input.value;
        });
    });

    document.getElementById('ca-reset').addEventListener('click', function() {
        P = { ...DEFAULTS };
        sliders.forEach(function(s) {
            var input = document.getElementById(s.id);
            var val = document.getElementById(s.id + '-val');
            input.value = DEFAULTS[s.key];
            val.textContent = DEFAULTS[s.key];
        });
    });

    // Read CA ink color from CSS variables
    let caR = 26, caG = 26, caB = 26;
    function updateCAColor() {
        const s = getComputedStyle(document.documentElement);
        caR = s.getPropertyValue('--ca-ink-r').trim() || 26;
        caG = s.getPropertyValue('--ca-ink-g').trim() || 26;
        caB = s.getPropertyValue('--ca-ink-b').trim() || 26;
    }
    updateCAColor();

    // Settings toggle
    var settingsBtn = document.getElementById('settings-toggle');
    var caPanel = document.getElementById('ca-panel');
    settingsBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        caPanel.classList.toggle('open');
    });
    caPanel.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('click', function() { caPanel.classList.remove('open'); });

    // Theme toggle
    var toggleBtn = document.getElementById('theme-toggle');
    function updateToggleLabel() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        toggleBtn.textContent = isDark ? '\u2600' : '\u263E';
    }
    updateToggleLabel();

    toggleBtn.addEventListener('click', function() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateToggleLabel();
        updateCAColor();
    });

    // Also update if OS preference changes and no manual override
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            updateToggleLabel();
            updateCAColor();
        }
    });

    resize();
    window.addEventListener('resize', resize);
    loop();
})();
</script>

</body>
</html>
